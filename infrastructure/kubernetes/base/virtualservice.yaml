apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: aibh-agent-engine-route
  namespace: aibh-prod
spec:
  hosts:
    - aibh-agent-engine-svc.aibh-prod.svc.cluster.local
  http:
    - route:
        - destination:
            host: aibh-agent-engine-svc
            subset: v2026.1
          weight: 90
        - destination:
            host: aibh-agent-engine-svc
            subset: v2026.2-canary
          weight: 10

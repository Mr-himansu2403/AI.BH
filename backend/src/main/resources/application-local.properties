# ═══════════════════════════════════════════════════════
# AI.BH — LOCAL DEVELOPER CONFIGURATION
# This file is for your machine only. NEVER commit real keys to Git.
# Copy this file and fill in EXACTLY ONE provider section below.
# ═══════════════════════════════════════════════════════

# ── H2 In-Memory Database (development only) ────────────
spring.datasource.url=jdbc:h2:file:./data/aibh_dev
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (visit http://localhost:8080/api/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect


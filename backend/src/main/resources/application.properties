# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Database Configuration (H2 for Development)
spring.datasource.url=jdbc:h2:file:./data/aibh_dev
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Security & JWT Configuration
app.jwt.secret=${JWT_SECRET:aibh-default-secret-key-change-in-production-minimum-256-bits-long}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# AI Configuration
# Primary provider — used first. Falls back to others if this fails.
# Options: anthropic | gemini | openai | ollama
app.ai.provider=${AI_PROVIDER:anthropic}
app.ai.providers=${AI_PROVIDERS:anthropic,gemini,openai,ollama}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,https://localhost:*}
spring.ai.openai.api-key=${OPENAI_API_KEY:dummy-key}
openai.api.key=${OPENAI_API_KEY:dummy-key}
openai.api.url=https://api.openai.com/v1/chat/completions
spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:dummy-key}
app.ai.gemini.api-key=${GEMINI_API_KEY:dummy-key}
app.ai.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models}
app.ai.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}

# Ollama (Task 4 — Local AI, Zero Latency, Zero Cost)
# SETUP: Install from https://ollama.com then run: ollama pull mistral
# Models: mistral (fastest general), codellama (best for code), llama3 (best reasoning)
# To activate: set app.ai.provider=ollama above and restart start-dev.bat
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_MODEL:mistral}

# Vector Store Configuration
spring.ai.vectorstore.simple.file-path=data/vectorstore.json

# Actuator & Monitoring Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.metrics.tags.application=ai-bh
management.metrics.tags.environment=${SPRING_PROFILES_ACTIVE:dev}

# Logging Configuration
logging.level.com.aibh=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Performance Configuration
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: aibh_db
      POSTGRES_USER: aibh_user
      POSTGRES_PASSWORD: aibh_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibh_user -d aibh_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build: ../backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aibh_db
      SPRING_DATASOURCE_USERNAME: aibh_user
      SPRING_DATASOURCE_PASSWORD: aibh_password
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-aibh-docker-secret-key-change-in-production-minimum-256-bits-long}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/aibh/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  frontend:
    build: ../frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: http://localhost:8080/api
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
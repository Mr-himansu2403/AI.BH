version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: aibh_db
      POSTGRES_USER: aibh_user
      POSTGRES_PASSWORD: aibh_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aibh_user -d aibh_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: 
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aibh_db
      SPRING_DATASOURCE_USERNAME: aibh_user
      SPRING_DATASOURCE_PASSWORD: aibh_password
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-aibh-docker-secret-key-change-in-production-minimum-256-bits-long}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/aibh/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  agent-engine:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.agent-engine
    ports:
      - "8001:8001"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - MEMORY_SERVICE_URL=http://memory-service:8002
    restart: unless-stopped

  memory-service:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.memory-service
    ports:
      - "8002:8002"
    restart: unless-stopped

  web-app:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile.web
    ports:
      - "3001:3001"
    environment:
      - AGENT_ENGINE_URL=http://agent-engine:8001/api/orchestrator/chat
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api
    depends_on:
      - agent-engine
      - backend
    restart: unless-stopped

  legacy-frontend:
    build: 
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080/api
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
